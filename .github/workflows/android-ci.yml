name: Crystal Android CI/CD

on:
  push:
    branches: [ main, master ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main, master ]

jobs:
  lint-and-test:
    name: Lint & Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Full history needed for dynamic Git versioning

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.11.1

      - name: Run KtLint & Detekt
        run: gradle ktlintCheck detekt --continue || true

      - name: Run Unit Tests
        run: gradle testDebugUnitTest --continue

  build-artifacts:
    name: Build APK & Bundle (AAB)
    needs: lint-and-test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.11.1

      - name: Extract Dynamic Git Version
        id: versioning
        run: |
          COMMIT_COUNT=$(git rev-list --count HEAD)
          TAG_NAME=$(git describe --tags --always)
          echo "VERSION_CODE=$COMMIT_COUNT" >> $GITHUB_OUTPUT
          echo "VERSION_NAME=$TAG_NAME" >> $GITHUB_OUTPUT
          echo "Building Crystal version: $TAG_NAME (code: $COMMIT_COUNT)"

      - name: Build Debug & Release APK
        run: gradle assembleDebug assembleRelease

      - name: Build Android App Bundle (AAB)
        run: gradle bundleRelease

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Crystal-APK-${{ steps.versioning.outputs.VERSION_NAME }}
          path: app/build/outputs/apk/**/*.apk

      - name: Upload Bundle Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Crystal-Bundle-${{ steps.versioning.outputs.VERSION_NAME }}
          path: app/build/outputs/bundle/**/*.aab

      - name: Create GitHub Release on Tag
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/bundle/release/*.aab
          generate_release_notes: true
